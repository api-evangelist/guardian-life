- aid: guardian-life:group-verification-of-benefits
  name: Group Verification of Benefits API
  description: >-
    Secure, real-time access to request provider benefits verification for members and
    dependents. The technology partner generates a request by supplying group policy
    number, patient relation to member, patient identifier, date of birth, first and last
    name, and CDT code. A successful response returns comprehensive details for all
    applicable dental plan types covering plan options, copays, deductibles and more.
  humanURL: https://developer.guardianlife.com/api/52
  tags:
