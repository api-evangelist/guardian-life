apis:
- aid: guardian-life:evidence-of-insurability
  name: Evidence of Insurability (EOI) API
  description: >-
    Secure, real-time EOI decisioning on a benefit technology partner's platform when
    required by an elected Guardian benefit. Employees required to submit EOI are presented
    the required health questions during their benefit shopping experience and receive
    instant notification of approval or referral to underwriting. Where underwriting review
    is required, the partner can call Guardian's system for EOI transaction status updates.
  humanURL: https://developer.guardianlife.com/api/30
  tags:
  - Evidence of Insurability
  - Underwriting
  - Group Insurance
  properties:
  - type: APIReference
    url: https://developer.guardianlife.com/api/30
- aid: guardian-life:benefits
  name: Benefits API
  description: >-
    Secure, real-time access to read and update employee and dependent benefit data. Once a
    Guardian policy is established, benefit technology partners use the Member Benefits API
    endpoints to enroll and terminate employees, update employee records such as adding
    dependents, process demographic and benefit changes, and retrieve employee, dependent,
    and benefit information for data synchronization. Member Benefits APIs use the LIMRA
    Data Exchange (LDEx) Standards.
  humanURL: https://developer.guardianlife.com/api/31
  tags:
  - Member Benefits
  - Enrollment
  - Eligibility
  - LDEx
  - Group Insurance
  properties:
  - type: APIReference
    url: https://developer.guardianlife.com/api/31
- aid: guardian-life:policy
  name: Policy API
  description: >-
    Secure, real-time access to Guardian benefit plan information including all of the
    insurance product rules, attributes, and rates required to configure a Guardian plan on
    a benefit technology partner's platform. Once a policy is sold and implemented, the
    partner can pull all product and plan information, configure their platform, and begin
    employee enrollment, reducing implementation effort, time, and errors. Can be used
    anytime changes are made to a policy's products and rates.
  humanURL: https://developer.guardianlife.com/api/32
  tags:
  - Policy
  - Plan Configuration
  - Rates
  - Group Insurance
  properties:
  - type: APIReference
    url: https://developer.guardianlife.com/api/32
- aid: guardian-life:retail-individual-products
  name: Retail Individual Products
  description: >-
    Real-time quote and product info exposed through higher-level capabilities rather than
    lower-level APIs requiring intimate system knowledge, fronted by an orchestration layer
    so retail products can be sold through various distribution channels. Comprises seven
    operations against the Guardian Retail administrative system for Dental policies:
    Retail Enrollment (send new Dental enrollments with subscriber/member information and
    plan selection), Retail Add Dependent, Retail Delete Dependent, Retail Update Customer
    Information, Retail Reinstatement, Retail Cancellation, and Retail Status.
  humanURL: https://developer.guardianlife.com/api/37
  tags:
  - Retail
  - Dental Insurance
  - Enrollment
  - Policy Administration
  properties:
  - type: APIReference
    url: https://developer.guardianlife.com/api/37
- aid: guardian-life:group-rating-quoting
  name: Group Rating & Quoting API
  description: >-
    Secure, real-time access to request and retrieve a quote for Guardian products. The
    technology partner requests a quote for any product by supplying specific details
    regarding the broker, policy holder, products, census, and additional documents. Once
    the proposal is ready an API notification triggers back to the technology platform, and
    the partner retrieves the requested quote, including a PDF output of the data.
  humanURL: https://developer.guardianlife.com/api/38
  tags:
  - Quoting
  - Rating
  - Group Insurance
  - Brokers
  tags_raw:
  - Quoting
  - Rating
  - Group Insurance
  - Broker
  properties:
  - type: APIReference
    url: https://developer.guardianlife.com/api/38
